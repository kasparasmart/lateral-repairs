# =============================================================================
# Lateral Repairs static frontend: ADDITIONS for public_html/.htaccess
#
# MERGE these lines into the EXISTING public_html/.htaccess (append at the end).
# Do NOT replace that file: it may contain rules the existing PHP backend needs.
#
# Every header/caching rule below is scoped by URL path to the files of the new
# frontend, so the existing PHP pages and admin keep their current behaviour.
# Requires Apache 2.4 (<If> expressions) with mod_headers / mod_deflate.
# NOT VERIFIED against the Serveriai.lt server — run the post-deployment tests in
# DEPLOY.md after applying, and remove this block again if the site returns HTTP 500.
# =============================================================================

# --- 1. Homepage: serve the new index.html before any old index.php -----------
# index.php stays as fallback, so folders that only contain index.php
# (for example a PHP admin folder) keep working.
DirectoryIndex index.html index.php

# --- 2. MIME types (older Apache builds lack woff2) ---------------------------
AddType font/woff2 .woff2

# --- 3. Compression (three.min.js is 660 KB uncompressed, ~170 KB gzipped) ----
<IfModule mod_deflate.c>
  AddOutputFilterByType DEFLATE text/html text/css text/plain text/xml application/xml application/javascript text/javascript image/svg+xml
</IfModule>

<IfModule mod_headers.c>
  # --- 4. Security headers: new frontend pages only ---------------------------
  <If "%{REQUEST_URI} =~ m#^/(index\.html|privacy\.html|cookies\.html|products/[a-z0-9-]+\.html)?$#">
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    # form-action 'self' allows a same-origin PHP form handler. If the contact form will post to
    # another origin, add that origin here.
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; frame-src https://www.youtube-nocookie.com; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'"
  </If>

  # --- 5. Caching: versioned (?v=N) frontend assets for 1 year, photos for 7 days
  <If "%{REQUEST_URI} =~ m#^/assets/(css|js|fonts|vendor)/#">
    Header set Cache-Control "public, max-age=31536000, immutable"
    Header set X-Content-Type-Options "nosniff"
  </If>
  <If "%{REQUEST_URI} =~ m#^/images/(products|gallery|certs)/#">
    Header set Cache-Control "public, max-age=604800"
  </If>
  # PDFs (datasheets, ISO certificate) are replaced under the same filename, so keep them short-lived.
  <If "%{REQUEST_URI} =~ m#^/assets/(datasheets|certs)/.+\.pdf$#">
    Header set Cache-Control "public, max-age=3600"
  </If>

  # --- 6. HSTS: leave commented until HTTPS is confirmed working ---------------
  # Enable only after https://lateralrepairs.com AND https://www.lateralrepairs.com both
  # serve a valid certificate. Once sent, browsers refuse plain HTTP for 2 years.
  # Header always set Strict-Transport-Security "max-age=63072000"
</IfModule>

# --- 7. OPTIONAL: force HTTPS + bare domain ------------------------------------
# Only if the existing .htaccess does NOT already redirect. Check first: two
# competing redirect blocks can cause a redirect loop. The canonical URLs of the
# new site use https://lateralrepairs.com/ (no www), so www must redirect TO the
# bare domain, never the other way round.
# <IfModule mod_rewrite.c>
#   RewriteEngine On
#   RewriteCond %{HTTPS} !=on [OR]
#   RewriteCond %{HTTP_HOST} ^www\. [NC]
#   RewriteRule ^ https://lateralrepairs.com%{REQUEST_URI} [L,R=301]
# </IfModule>
