# =============================================================================
# Lateral Repairs static frontend: lines to MERGE into the EXISTING
# public_html/.htaccess of the CMS Made Simple site. Never replace that file.
#
# DirectoryIndex is NOT changed. index.php stays CMS Made Simple's front controller for
# CMS pages, pretty URLs, module actions and /admin/. NOT VERIFIED against the
# Serveriai.lt configuration; see deployment/DEPLOY.md §6 and run the post-deployment tests.
# =============================================================================

# -----------------------------------------------------------------------------
# PART A: serve the new homepage for "/" only.
# PLACE IT in the existing file directly AFTER the existing "RewriteEngine on" line
# (and after "RewriteBase /" if present), BEFORE the CMS Made Simple rewrite rules.
# If the existing file has no "RewriteEngine on", put both lines below at its top.
#
# Matches only: GET or HEAD request, for exactly the site root, with NO query string.
# Not matched, so it reaches index.php as today: /?page=..., /?mact=... (module actions),
# any POST to /, /index.php, every CMS pretty URL, /admin/ and all other subdirectories.
# -----------------------------------------------------------------------------
# RewriteEngine on          <- already present in a CMSMS .htaccess; add only if missing
RewriteCond %{REQUEST_METHOD} ^(GET|HEAD)$
RewriteCond %{QUERY_STRING} ^$
RewriteRule ^$ index.html [L]

# -----------------------------------------------------------------------------
# PART B: append at the END of the existing file. Everything is scoped to the new
# frontend's own paths (/, /index.html, /privacy.html, /cookies.html, /products/*.html,
# /lr-assets/), so CMS pages, /admin/ and module output are untouched.
# -----------------------------------------------------------------------------
AddType font/woff2 .woff2

<IfModule mod_deflate.c>
  <If "%{REQUEST_URI} =~ m#^/(index\.html|privacy\.html|cookies\.html|products/[a-z0-9-]+\.html|lr-assets/.+\.(css|js|svg))?$#">
    SetOutputFilter DEFLATE
  </If>
</IfModule>

<IfModule mod_headers.c>
  <If "%{REQUEST_URI} =~ m#^/(index\.html|privacy\.html|cookies\.html|products/[a-z0-9-]+\.html)?$#">
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; frame-src https://www.youtube-nocookie.com; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'"
  </If>
  <If "%{REQUEST_URI} =~ m#^/lr-assets/(css|js|fonts|vendor)/#">
    Header set Cache-Control "public, max-age=31536000, immutable"
    Header set X-Content-Type-Options "nosniff"
  </If>
  <If "%{REQUEST_URI} =~ m#^/lr-assets/images/#">
    Header set Cache-Control "public, max-age=604800"
  </If>
  <If "%{REQUEST_URI} =~ m#^/lr-assets/(datasheets|certs)/.+\.pdf$#">
    Header set Cache-Control "public, max-age=3600"
  </If>
  # HSTS: enable only after HTTPS works on lateralrepairs.com AND www.lateralrepairs.com.
  # Header always set Strict-Transport-Security "max-age=63072000"
</IfModule>

# PART B is optional for launch: the site works without it. If adding it causes an HTTP 500
# (a module or <If> not permitted here), remove PART B and keep PART A.
